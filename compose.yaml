services:
  db:
    image: postgres:18.3
    environment:
      POSTGRES_USER: service
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: service_ilyxa_dev
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U service -d service_ilyxa_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
